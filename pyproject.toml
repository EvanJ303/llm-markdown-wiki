[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-markdown-wiki"
version = "0.1.0"
description = " Simple CLI-based markdown wiki tool that provides an entry point"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Evan Johnson", email = "ecrjmegamanx@gmail.com"}
]
dependencies = [
  "mcp[cli] >= 1.0.0",
  "typer >= 0.12.0",
  "python-docx >= 1.1.2",
  "pypdf >= 4.0.0",
  "openpyxl >= 3.1.0",
]

[project.scripts]
llmwiki = "llmwiki:app"
llmwiki-mcp = "llmwiki.mcp_server:main"
